api_version = "2026-10"

[[extensions]]
name = "b2b-checkout-validator"
handle = "termslock-checkout-validator"
type = "function"
uid = "8f2a9c40-7d1e-4b3a-9c12-100000000001"
description = "B2B PO Number, Billing Address, Wholesale MOQ & Hazmat Checkout Validation Function (2026-10)"

  [[extensions.targeting]]
  target = "purchase.cart-checkout-validation.run"
  input_query = "run.graphql"
  export = "run"

  [extensions.build]
  command = "npx esbuild src/run.ts --bundle --platform=neutral --format=esm --outfile=../../dist/validator.bundle.mjs"
  path = "dist/function.wasm"

  [extensions.ui]
  handle = "termslock-checkout-validator-ui"
  target = "admin.checkout-validation.render"
  module = "./src/AdminUiExtension.ts"

  [extensions.ui.paths]
  create = "/rules/validation/new"
  details = "/rules/validation/:id"
